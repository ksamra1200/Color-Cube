<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Color Block</title>
    <meta name="description" content="Drag blocks onto the board, clear rows and columns, chain combos. No ads." />
    <meta name="theme-color" content="#2b4796" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Color Block" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="safe-probe" aria-hidden="true"></div>

    <!-- Home -->
    <section id="screen-home" class="screen">
      <div id="home-bg" aria-hidden="true"></div>
      <div class="home-bar">
        <button class="icon-btn" id="btn-settings" aria-label="Settings">
          <svg viewBox="0 0 24 24">
            <path
              d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.3 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"
              transform="translate(-1 0)"
            />
          </svg>
        </button>
      </div>
      <div class="home-main">
        <h1 class="logo" aria-label="Color Block">
          <span class="logo-row" aria-hidden="true">
            <span class="tile" style="--c: #f04848">C</span>
            <span class="tile" style="--c: #ff9330">O</span>
            <span class="tile" style="--c: #ffcf33">L</span>
            <span class="tile" style="--c: #5acb4e">O</span>
            <span class="tile" style="--c: #35c6ea">R</span>
          </span>
          <span class="logo-row" aria-hidden="true">
            <span class="tile" style="--c: #3f73ee">B</span>
            <span class="tile" style="--c: #9b5cf0">L</span>
            <span class="tile" style="--c: #f262b5">O</span>
            <span class="tile" style="--c: #f04848">C</span>
            <span class="tile" style="--c: #ff9330">K</span>
          </span>
        </h1>
        <div class="home-best">
          <svg class="crown" viewBox="0 0 24 24"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 11H5z" /></svg>
          <span id="home-best">0</span>
        </div>
      </div>
      <div class="home-buttons">
        <button class="btn btn-green btn-big" id="btn-journey">
          <span>Journey</span><small id="journey-sub">Level 1</small>
        </button>
        <button class="btn btn-orange btn-big" id="btn-classic">
          <span>Classic</span><small id="classic-sub">Play</small>
        </button>
      </div>
    </section>

    <!-- Game -->
    <section id="screen-game" class="screen hidden">
      <canvas id="board"></canvas>
      <div id="hud">
        <div class="hud-bar">
          <button class="icon-btn" id="btn-pause" aria-label="Pause">
            <svg viewBox="0 0 24 24">
              <rect x="6" y="5" width="4" height="14" rx="1.5" />
              <rect x="14" y="5" width="4" height="14" rx="1.5" />
            </svg>
          </button>
          <div class="hud-title">
            <div class="best hud-classic">
              <svg class="crown" viewBox="0 0 24 24"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 11H5z" /></svg>
              <span id="hud-best">0</span>
            </div>
            <div class="level-label hud-journey hidden">Level <span id="hud-level">1</span></div>
          </div>
          <span class="icon-btn-spacer"></span>
        </div>
        <div class="hud-main">
          <div class="hud-classic">
            <div class="score" id="hud-score">0</div>
          </div>
          <div class="hud-journey hidden">
            <div class="goals" id="hud-goals"></div>
          </div>
        </div>
        <div class="hud-sub">
          <div class="combo-badge" id="hud-combo">
            <svg viewBox="0 0 24 24">
              <path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5 .2 2 1 3 2 3.2C11 9 11 5.5 12 2z" />
            </svg>
            Combo <b id="hud-combo-count">2</b>
            <span class="pips" id="hud-combo-pips"></span>
          </div>
        </div>
      </div>
      <div id="fx-layer" aria-live="polite"></div>
    </section>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-card"></div>
    </div>
    <div id="confetti" aria-hidden="true"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
